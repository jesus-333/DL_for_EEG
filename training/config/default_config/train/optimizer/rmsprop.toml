# RMSprop optimizer (torch.optim.RMSprop).
# Copy this [optimizer] table into training_clf.toml to use RMSprop.
[optimizer]
name = "rmsprop"
# Learning rate (must be > 0).
lr = 0.01
# Smoothing constant (must be > 0).
alpha = 0.99
# Term added to the denominator for numerical stability (must be > 0).
eps = 1e-8
# L2 penalty (must be >= 0).
weight_decay = 0.0
# Momentum factor (must be >= 0).
momentum = 0.0
# Compute the centered RMSProp (normalize the gradient by an estimate of its variance).
centered = false
