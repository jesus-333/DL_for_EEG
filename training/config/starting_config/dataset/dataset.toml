# =====================================================================
# Default dataset configuration (jade.config.dataset.dataset_config)
# =====================================================================
# Skeleton config for downloading + preprocessing an EEG dataset (moabb + MNE).
# Load it with: dataset_config.from_toml("dataset.toml").

# moabb dataset name (case-insensitive), e.g. "BNCI2014_001". REQUIRED (must be non-empty).
dataset_name = "BNCI2014_001"

# Subjects to load. Leave commented to load all the subjects.
subjects = [3]

# Resample the signal. If true, resample_freq must be set (> 0).
resample = false
resample_freq = 128.0

# Normalization code: -1 (none), 1, 2 or 3 (see dataset_config for the exact scheme).
normalize = -1

# Where to store / read the downloaded data. Leave commented to use the moabb default (~/mne_data/).
# dataset_folder = "/data/eeg"

# ---------------------------------------------------------------------
# Filtering (MNE), applied at preprocessing time (OPTIONAL, pick at most ONE)
# ---------------------------------------------------------------------
# Filtering is OPTIONAL: with no [filter] section the raw signal is kept
# (dataset_config.filter defaults to None). To enable it, uncomment the [filter] block below
# and fill it with the keys from one of the files in ./filter/ (one per filter type: bandpass.toml,
# bandstop.toml, lowpass.toml, highpass.toml, notch.toml). Those files hold just the keys (no [filter] header).
# [filter]
# filter_type = "bandpass"
# l_freq = 8.0
# h_freq = 32.0
