name = "eegnet_classifier"
use_bias = false
D = 2
activation = "elu"
prob_dropout = 0.5
use_dropout_2d = false
C = 22
T = 1000
depth_first_layer = 1
filter_1 = 8
c_kernel_1 = [ 1, 64,]
c_kernel_2 = [ 22, 1,]
filter_2 = 16
c_kernel_3 = [ 1, 16,]
flatten_output = false
input_size = [ 1, 1, 22, 1000,]
n_classes = 4
use_softmax = false
print_var = false

[pooling]
pooling_type_1 = "blur"
pooling_type_2 = "blur"
pooling_factor_1 = 4
pooling_factor_2 = 8

[pooling.params_1]
pooling_type = "blur"
decimation_factor = 4
padding_mode = "reflect"
phase = "center"
gain = "dc"
warn_if_worse_than_boxcar = true
kernel = "binomial"

[pooling.params_2]
pooling_type = "blur"
decimation_factor = 8
padding_mode = "reflect"
phase = "center"
gain = "dc"
warn_if_worse_than_boxcar = true
kernel = "binomial"
