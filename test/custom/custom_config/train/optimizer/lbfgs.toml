# LBFGS optimizer (torch.optim.LBFGS). A quasi-Newton method; note it needs a closure to be called.
# NOTE: this file has NO [optimizer] header on purpose, so its settings load flat and can be nested directly
# under the parent's `optimizer` key. To paste them into training_clf.toml instead, put them under an [optimizer] section (training_config.optimizer).
name = "lbfgs"
# Learning rate (must be > 0).
lr = 1.0
# Maximum number of iterations per optimization step.
max_iter = 20
# Termination tolerance on the first-order optimality (gradient).
tolerance_grad = 1e-7
# Termination tolerance on the function/parameter change.
tolerance_change = 1e-9
# Update history size.
history_size = 100
