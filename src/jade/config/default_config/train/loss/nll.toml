# Negative log-likelihood loss (torch.nn.NLLLoss).
# IMPORTANT: it expects log-probabilities, so build the model with use_softmax = true (LogSoftmax head).
# NOTE: this file has NO [loss] header on purpose, so its settings load flat and can be nested directly
# under the parent's `loss` key. To paste them into training_clf.toml instead, put them under a [loss] section (training_config.loss).
name = "nll"
# Target value that is ignored and does not contribute to the gradient.
ignore_index = -100
# Reduction applied to the output: "none", "mean" or "sum".
reduction = "mean"
# Optional per-class coefficients, used to counter a class imbalance (a list with one entry per class;
# its length must match the model n_classes). They are the `weight` argument of the torch loss; the
# config calls them class_weight so they are not mistaken for the trainable weights of the model.
# class_weight = [1.0, 1.0, 1.0, 1.0]
