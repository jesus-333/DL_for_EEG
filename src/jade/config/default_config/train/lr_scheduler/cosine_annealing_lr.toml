# CosineAnnealingLR scheduler (torch.optim.lr_scheduler.CosineAnnealingLR): cosine decay over T_max epochs.
# NOTE: this file has NO [lr_scheduler] header on purpose, so its settings load flat and can be nested directly
# under the parent's `lr_scheduler` key. To paste them into training_clf.toml instead, put them under a [lr_scheduler] section (training_config.lr_scheduler).
name = "cosine_annealing_lr"
# Maximum number of iterations (epochs) of the cosine schedule.
T_max = 50
# Minimum learning rate reached at the end of the schedule.
eta_min = 0.0
