# High-pass filter (MNE Raw.filter): keep the frequencies above the cutoff l_freq.
# NOTE: this file has NO [filter] header on purpose, so its settings load flat and can be nested directly
# under the parent's `filter` key. To paste them into dataset.toml instead, put them under a [filter] section (dataset_config.filter).
filter_type = "highpass"
# Cutoff (Hz): keep the frequencies above l_freq. Do NOT set h_freq for a high-pass.
l_freq = 1.0
# Filter method: "iir" (moabb default) or "fir".
method = "iir"
# IIR design (filter order / type). Leave commented to use MNE's defaults.
# iir_params = { order = 4, ftype = "butter" }
# FIR-only options (ignored by the IIR method).
filter_length = "auto"
l_trans_bandwidth = "auto"
phase = "zero"
fir_window = "hamming"
fir_design = "firwin"
# Channels to filter (MNE "picks" selector).
picks = "data"
