# Average (boxcar) 1D pooling - the anti-aliasing baseline.
# jade.config.model.avg_pooling_config -> jade.model.pooling_1d.avg_pool_1d
pooling_type = "avg"
# Decimation factor M (the time axis is reduced by this factor).
decimation_factor = 2
# Signal extension before filtering: "reflect", "replicate", "constant" or "circular".
padding_mode = "reflect"
# Which sample of each block of M is kept: "center" (matches nn.AvgPool1d), "first", or an int in [0, M).
phase = "center"
# Kernel normalization: "dc" (unit DC gain), "orthonormal" or "none".
gain = "dc"
# Warn at build time if the filter is worse than a plain boxcar of length M.
warn_if_worse_than_boxcar = true
