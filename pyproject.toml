[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The distribution (PyPI) name and the importable package name are both "jade"
# (Just Another Deep-learning EEG package). The code lives in src/jade (src-layout),
# so point the wheel at that folder: hatchling then exposes it as the top-level
# import package "jade".
[tool.hatch.build.targets.wheel]
packages = ["src/jade"]

# Note that the commented TOML skeleton configs (src/jade/config/default_config, used by the
# "create-default-config" cli command) are shipped automatically, since every non-ignored file
# inside src/jade is included. Do not add them again with a force-include: recent hatchling
# versions (e.g. 1.33, but not 1.29) refuse to add a second file at the same path of the wheel.

# Restrict the source distribution to the package. Without this, the sdist includes every
# file of the repository that is not gitignored (e.g. the downloaded datasets inside data/,
# tens of GB), and `hatchling build` takes forever to compress them.
[tool.hatch.build.targets.sdist]
only-include = ["src/jade", "pyproject.toml", "README.md", "LICENSE"]

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

[project]
name = "jade"
version = "0.0.1"
license = "Apache-2.0"
authors = [
  { name = "Alberto (Jesus) Zancanaro", email = "alberto.zancanaro.1@gmail.com" },
]
description = "JADE - Just Another Deep-learning EEG package"
dependencies = [
	"numpy",
	"matplotlib",
	"pandas",
	"toml",
    "torch",
    "torchvision",
    "torchmetrics",
]
[project.optional-dependencies]
extra = [
	"dtw-loss-functions>=1.0.4", # The soft_dtw / block_dtw API used by jade (implementation + sdtw_config) was introduced in 1.0.4
	"wandb",
]
dataset = [
	"mne",
	"moabb"
]
braindecode = [
	"braindecode",
]

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

# Console scripts exposed by the cli subpackage (src/jade/cli). Each command maps
# to an entry-point function in jade.cli.cli that only parses its arguments and
# delegates to the matching implementation file.
[project.scripts]
download-dataset-moabb = "jade.cli.cli:download_dataset_moabb"
create-default-config = "jade.cli.cli:default_config"
download-project-runs-metrics = "jade.cli.cli:download_project_runs_metrics"
