[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The distribution (PyPI) name is "jade" (Just Another Deep-learning EEG package),
# but the importable package name is "dl_eeg" (as in scikit-learn -> sklearn).
# The code lives in src/dl_eeg, so point the wheel at that folder: hatchling then
# exposes it as the top-level import package "dl_eeg".
[tool.hatch.build.targets.wheel]
packages = ["src/dl_eeg"]

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
[tool.hatch.build.targets.wheel.sources]
"src" = "jade"

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - 

[project]
name = "jade"
version = "0.0.1"
license = "Apache-2.0"
authors = [
  { name = "Alberto (Jesus) Zancanaro", email = "alberto.zancanaro.1@gmail.com" },
]
description = "JADE - Just Another Deep-learning EEG package"
dependencies = [
	"numpy",
	"matplotlib",
	"pandas",
	"toml",
    "torch",
    "torchvision",
]
[project.optional-dependencies]
extra = [
	"dtw-loss-functions",
	"wandb",
]
dataset = [
	"mne",
	"moabb"
]
