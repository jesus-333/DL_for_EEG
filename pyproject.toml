[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["/src"]

[tool.hatch.build.targets.wheel.sources]
"src" = "dego"

# - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - 

[project]
name = "dego"
version = "0.0.1"
license = "Apache-2.0"
authors = [
  { name = "Alberto (Jesus) Zancanaro", email = "alberto.zancanaro.1@gmail.com" },
]
description = ""
dependencies = [
	"numpy",
	"matplotlib",
	"pandas",
	"toml",
    "torch",
    "torchvision",
]
[project.optional-dependencies]
extra = [
	"dtw-loss-functions",
	"wandb",
]
dataset = [
	"mne",
	"moabb"
]
