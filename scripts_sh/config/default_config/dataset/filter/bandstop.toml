# Band-stop filter (MNE Raw.filter): reject the frequencies between h_freq and l_freq.
# Copy this [filter] table into dataset.toml to use it (dataset_config.filter).
[filter]
filter_type = "bandstop"
# Reject the band between h_freq and l_freq (here 48-52 Hz, e.g. 50 Hz line noise).
# NOTE the reversed convention: a band-stop requires l_freq > h_freq.
l_freq = 52.0
h_freq = 48.0
# Filter method: "iir" (moabb default) or "fir".
method = "iir"
# IIR design (filter order / type). Leave commented to use MNE's defaults.
# iir_params = { order = 4, ftype = "butter" }
# FIR-only options (ignored by the IIR method).
filter_length = "auto"
l_trans_bandwidth = "auto"
h_trans_bandwidth = "auto"
phase = "zero"
fir_window = "hamming"
fir_design = "firwin"
# Channels to filter (MNE "picks" selector).
picks = "data"
